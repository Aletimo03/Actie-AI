# The app on the AWS server: like the root docker-compose.yml, but with the images CI
# published (IMAGE_TAG=sha-<commit>) and Caddy in front for HTTPS. Run by up.sh, which writes
# .env (secrets from SSM and the server, never from git).
name: actie

services:
  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/aletimo03/actie-api:${IMAGE_TAG}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_CACHE_DIR: ""
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    image: ghcr.io/aletimo03/actie-web:${IMAGE_TAG}
    environment:
      API_UPSTREAM: http://api:8000
      REAL_IP_FROM: 172.30.0.0/24  # Caddy is the only proxy in front, on this network
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # the certificates: kept across restarts (Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  # One-off jobs, run by up.sh and the retention timer, never by `up`.
  law:
    profiles: [jobs]
    image: ghcr.io/aletimo03/actie-api:${IMAGE_TAG}
    command: [python, -m, backend.app.law_snapshot, load]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  retention:
    profiles: [jobs]
    image: ghcr.io/aletimo03/actie-api:${IMAGE_TAG}
    command: [python, -m, backend.app.retention, --days, "30"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24  # fixed, so nginx knows which proxy to trust

volumes:
  pgdata:
  caddy_data:
  caddy_config:
