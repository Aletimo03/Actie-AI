# Dependabot keeps every pin moving on purpose: one grouped pull request a week per
# ecosystem, and only versions at least 14 days old (the same cooldown as frontend/.npmrc
# and the uv constraints). Security updates for known vulnerabilities skip the cooldown.
# Each pull request runs the full CI, which is how a bump is shown to be safe.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go port) has no JavaScript API, which openapi-typescript needs.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      base-images: { patterns: ["*"] }
    ignore:
      # Python minor versions move with .python-version and uv.lock, on purpose.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Even Node majors only (LTS lines); 27 is not one.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx odd minors (1.31) are mainline: stay on the stable line.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    ignore:
      # A new Postgres major cannot read the pgdata volume without a migration.
      - dependency-name: pgvector/pgvector
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
