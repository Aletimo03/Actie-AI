# Lint and test on every push and pull request: the same commands as locally.
# Tests that need fetched data, a live LLM or Ollama skip themselves; the database
# tests run against a real Postgres with pgvector, like docker-compose.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # read-only token: CI only checks, it never writes

concurrency:  # a newer push cancels the run it makes obsolete
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: actie
          POSTGRES_PASSWORD: ci-only-password  # a throwaway database inside the CI runner
          POSTGRES_DB: actie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actie -d actie"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://actie:ci-only-password@localhost:5432/actie

    steps:
      # Actions pinned to a commit, not a movable tag (supply-chain cooldown: >= 2 weeks old).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true  # keyed on uv.lock: torch and friends download once

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
