# Lint and test on every push and pull request: the same commands as locally.
# Tests that need fetched data, a live LLM or Ollama skip themselves; the database
# tests run against a real Postgres with pgvector, like docker-compose.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # read-only token: CI only checks, it never writes

concurrency:  # a newer push cancels the run it makes obsolete
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: actie
          POSTGRES_PASSWORD: ci-only-password  # a throwaway database inside the CI runner
          POSTGRES_DB: actie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actie -d actie"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://actie:ci-only-password@localhost:5432/actie

    steps:
      # Actions pinned to a commit, not a movable tag (supply-chain cooldown: >= 2 weeks old).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true  # keyed on uv.lock: torch and friends download once

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: API spec matches the committed one (the frontend's types come from it)
        run: uv run python -m backend.app.openapi | diff - frontend/openapi.json

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly as locked, no install scripts)
        run: npm ci

      - name: Generated types match the API spec
        run: npx openapi-typescript openapi.json -o "$RUNNER_TEMP/schema.d.ts" && diff "$RUNNER_TEMP/schema.d.ts" src/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    # Builds both images, starts the whole stack as `docker compose up` does locally, and
    # checks it from the outside. Example settings only: no keys, no model calls.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Settings from the example file
        run: cp .env.example .env

      - name: Build the images
        run: docker compose build

      - name: Start the stack and wait for every healthcheck
        run: docker compose up -d --wait

      - name: Smoke test (routes, headers, non-root, no torch, size budgets)
        run: scripts/compose-smoke.sh

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    # Delivery: after every check passes on main, both images go to GHCR, tagged with the
    # commit (immutable: what deploys use) and `main` (the latest green build). Each gets
    # an SBOM and a provenance attestation signed by GitHub, so anyone can verify the
    # image was built here from this commit (gh attestation verify).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to GHCR with this job's own token
      id-token: write      # keyless signing of the attestation (Sigstore)
      attestations: write  # store the attestation on GitHub
    strategy:
      matrix:
        include:
          - { image: actie-api, context: ., dockerfile: backend/Dockerfile }
          - { image: actie-web, context: frontend, dockerfile: frontend/Dockerfile }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (GHCR needs lower case)
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          # BuildKit's SBOM scanner, pinned like everything else (its default is the moving
          # stable-1 tag); 1.12.0 is from 2026-08-13.
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
