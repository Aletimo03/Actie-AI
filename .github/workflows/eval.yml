# The agent eval as a gate: the 52 labelled systems run through the whole graph on the
# paid model, and the job fails if any is reported at a lower risk than its label.
# It costs money and needs the API key, so it never runs by itself: only on demand
# (Actions > Eval > Run workflow), quick (~15 systems, about $0.08 on Claude Haiku 5.5)
# after changing a prompt, full (~$0.27) before a release. The key is a secret of the
# `eval` environment, which forks never see.
name: Eval

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "quick (~15 systems, ~$0.08) or full (52, ~$0.27)"
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:  # never two paid runs at once; a queued one waits instead of cancelling
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: eval

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: actie
          POSTGRES_PASSWORD: ci-only-password  # a throwaway database inside the CI runner
          POSTGRES_DB: actie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actie -d actie"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://actie:ci-only-password@localhost:5432/actie
      LLM_MODEL: anthropic/claude-haiku-5-5
      LLM_FALLBACKS: ""
      LLM_REASONING_EFFORT: ""
      LLM_CACHE_DIR: ""  # a cached run proves nothing about today's model

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install the runtime dependencies (no ingestion packages, no torch)
        run: uv sync --locked --no-dev --no-group ingest

      - name: Load the law from the snapshot (db/schema.sql creates the vector extension)
        run: uv run --no-sync python -m evals.law_snapshot load

      - name: Run the eval (fails on any under-classification)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBSET: ${{ inputs.subset }}
        run: |
          flag=$([ "$SUBSET" = full ] && echo "" || echo "--quick")
          uv run --no-sync python -m evals.systems $flag --out eval-results.json | tee eval-report.txt

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-${{ github.run_id }}
          path: |
            eval-report.txt
            eval-results.json
          if-no-files-found: ignore
          retention-days: 90
