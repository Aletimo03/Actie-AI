# Included in every location: nginx drops server-level add_header in a location that
# sets its own, so one shared file keeps them all in force.
# Everything is self-hosted (fonts, icon, scripts), so nothing outside this origin is
# allowed; data: covers assets Vite inlines.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# The URL holds the assessment id, the key to its data: never send it to another site.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
