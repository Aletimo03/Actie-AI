# End-to-end test set: AI systems as a user would describe them, and the assessment
# the whole graph must reach. Labels follow the consolidated text 02024R1689-20260727.
#   risk      prohibited | high | limited | minimal (required)
#   banned    Art. 5(1) labels the report must list (any order)
#   basis     high-risk bases without the language prefix; "annex3_4" accepts any point of 4
#   duties    Art. 50 paragraphs the report must list (own or other role)
#   role      the final role (after Art. 25)
#   answers   replies to follow-up questions by id; anything else is skipped (blank)
#   why       the provision the label rests on
#   quick     in the --quick subset: every risk level, both languages, the known failures

# --- Prohibited (Art. 5) -------------------------------------------------------

[[system]]
id = "toy-dangerous-challenges"
quick = true
description = "We make a talking doll for children aged 4-8. Its AI voice assistant encourages the children to try risky stunts, like climbing furniture, to win in-app rewards."
lang = "en"
risk = "prohibited"
banned = ["b"]
why = "5(1)(b): exploits vulnerability due to age, causing or likely to cause significant harm"

