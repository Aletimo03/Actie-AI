# Retrieval test set: questions as a user would write them, and the chunks that
# answer them. A case is a hit at k if ANY expected id is in the top k results.
# Ids are chunk ids (see data/processed/<version>/chunks_<lang>.jsonl).

# --- High-risk use cases (Annex III) ---------------------------------------

[[case]]
query = "A tool that reads résumés and shortlists the best applicants for an interview."
lang = "en"
expected = ["en_annex3_4_a"]

[[case]]
query = "Our software ranks people who apply for jobs at our company."
lang = "en"
expected = ["en_annex3_4_a"]

[[case]]
query = "Un sistema che scarta automaticamente i curriculum meno adatti."
lang = "it"
expected = ["it_annex3_4_a"]
note = "'curriculum' is ambiguous in Italian: CV or school curriculum. Failed in the first vector search."

[[case]]
query = "an app that decides who gets a loan"
lang = "en"
expected = ["en_annex3_5_b"]

[[case]]
query = "Un'app che decide a chi concedere un prestito"
lang = "it"
expected = ["it_annex3_5_b"]

[[case]]
query = "An AI assistant that tells hospital patients how urgently they need to be seen"
lang = "en"
expected = ["en_annex3_5_d"]

[[case]]
query = "Face recognition to identify people from CCTV footage"
lang = "en"
expected = ["en_annex3_1_a", "en_art5_p1_h"]

[[case]]
query = "AI-powered medical device software for diagnosis"
lang = "en"
expected = ["en_annex1_seca_11", "en_annex1_seca_12", "en_art6_p1"]

